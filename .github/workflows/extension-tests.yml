name: executable-extension-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-extension.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python -m axiom_x.demo > /tmp/synthetic-demo.json
